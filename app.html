<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能账单管理平台 · 控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="bg-fx"></div>
<div class="bg-grid"></div>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="side-brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v4H4zM4 11h10v8H4zM16 11h4v8h-4z" stroke="#04211e" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </div>
      <div class="brand-name"><span id="sideBrand">智能账单平台</span><small>INTELLIBILL</small></div>
    </div>

    <div class="nav-group-label" data-i18n="nav_overview">总览</div>
    <a class="nav-item" data-route="dashboard">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="12" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="16" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
      经营仪表盘
    </a>

    <div class="nav-group-label" data-i18n="nav_proc">账单智能处理</div>
    <a class="nav-item" data-route="process">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      账单处理流水线
    </a>
    <a class="nav-item" data-route="invoices">
      <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M9 8h6M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      账单库
    </a>
    <a class="nav-item" data-route="approvals">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/></svg>
      审批中心
      <span class="nav-badge" id="apvBadge">3</span>
    </a>

    <div class="nav-group-label" data-i18n="nav_risk">风险与预测</div>
    <a class="nav-item" data-route="risk">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-4z" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v4m0 3v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      风险雷达
    </a>
    <a class="nav-item" data-route="collection">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 18l5-5 3 3 8-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 8h5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      催收预测
    </a>

    <div class="nav-group-label" data-i18n="nav_hub">智能中枢</div>
    <a class="nav-item" data-route="assistant">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 5a2 2 0 012-2h12a2 2 0 012 2v9a2 2 0 01-2 2H9l-5 4V5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="9" cy="9.5" r="1" fill="currentColor"/><circle cx="12" cy="9.5" r="1" fill="currentColor"/><circle cx="15" cy="9.5" r="1" fill="currentColor"/></svg>
      智能问答助手
    </a>
    <a class="nav-item" data-route="agents">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="7" r="3" stroke="currentColor" stroke-width="1.6"/><circle cx="5.5" cy="17" r="2.5" stroke="currentColor" stroke-width="1.6"/><circle cx="18.5" cy="17" r="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 10v3m0 0l-5 2m5-2l5 2" stroke="currentColor" stroke-width="1.5"/></svg>
      Agent 编排中心
    </a>

    <div class="side-foot">
      <div class="user-mini">
        <div class="avatar" id="uAvatar">LF</div>
        <div>
          <div class="u-name" id="uName">李芳军</div>
          <div class="u-role" id="uRole">财务共享中心 · 主管</div>
        </div>
        <button class="logout-btn" id="logoutBtn" title="退出登录">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 12H4m0 0l4-4m-4 4l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 4h6a2 2 0 012 2v12a2 2 0 01-2 2h-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">经营仪表盘</h1>
        <div class="crumb" id="pageCrumb">智能账单管理平台 / 总览</div>
      </div>
      <div class="topbar-right">
        <div class="lang-toggle" id="langToggle">
          <button data-lang="zh" class="active">中文</button>
          <button data-lang="en">English</button>
          <button data-lang="ar">العربية</button>
        </div>
        <div class="pill-live"><span class="dot-live"></span> 7 Agent 在线</div>
        <button class="icon-btn" id="notifBtn" title="通知">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 20a2 2 0 004 0" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
    </header>
    <main class="content" id="view"><!-- rendered by app.js --></main>
  </div>
</div>

<div class="toast-wrap" id="toast"></div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/app2.js"></script>
</body>
</html>
