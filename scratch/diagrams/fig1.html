<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;padding:0;background:#fff;font-family:Arial,sans-serif;}
  .canvas{width:1040px;height:600px;position:relative;background:#fff;}
</style></head>
<body>
<div class="canvas">
<svg width="1040" height="600" viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="12" y="18" font-size="14" font-weight="bold" fill="#004331">Intelligent Invoice Processing — Target-State Workflow (After)</text>
  <text x="12" y="34" font-size="10" fill="#64748b">Prototype operating model · automated evidence preparation with explicit human control and one governed handoff path</text>

  <!-- Lane headers -->
  <rect x="10" y="46" width="240" height="26" fill="#0B4A45"/>
  <text x="130" y="63" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Invoice &amp; Collection Officer</text>

  <rect x="252" y="46" width="270" height="26" fill="#003426"/>
  <text x="387" y="58" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Intelligent Invoice Platform</text>
  <text x="387" y="69" font-size="9" fill="#dff3e8" text-anchor="middle">(AI + deterministic rules)</text>

  <rect x="524" y="46" width="250" height="26" fill="#8a5a1e"/>
  <text x="649" y="63" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Internal Financial Auditor</text>

  <rect x="776" y="46" width="254" height="26" fill="#1f4e8c"/>
  <text x="903" y="58" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Revenue &amp; Collection</text>
  <text x="903" y="69" font-size="9" fill="#dce8f9" text-anchor="middle">Officer / Manager</text>

  <!-- Lane bodies -->
  <rect x="10" y="72" width="240" height="500" fill="#f2f7f5" stroke="#dfe6e3"/>
  <rect x="252" y="72" width="270" height="500" fill="#eaf6f1" stroke="#dfe6e3"/>
  <rect x="524" y="72" width="250" height="500" fill="#fbf2e6" stroke="#dfe6e3"/>
  <rect x="776" y="72" width="254" height="500" fill="#eef3fb" stroke="#dfe6e3"/>

  <!-- Officer: select invoice -->
  <rect x="30" y="92" width="200" height="44" rx="6" fill="#fff" stroke="#0B4A45" stroke-width="1.4"/>
  <text x="130" y="110" font-size="10" font-weight="bold" text-anchor="middle" fill="#0B4A45">Select sample invoice</text>
  <text x="130" y="124" font-size="8.5" text-anchor="middle" fill="#4a4a4a">Manual upload / simulated feed</text>

  <!-- Platform: ingest -->
  <rect x="272" y="92" width="230" height="44" rx="6" fill="#fff" stroke="#003426" stroke-width="1.4"/>
  <text x="387" y="110" font-size="10" font-weight="bold" text-anchor="middle" fill="#003426">Ingest, create draft ID, OCR, normalize</text>
  <text x="387" y="124" font-size="8.5" text-anchor="middle" fill="#4a4a4a">CAP-01 / CAP-02 / CAP-04</text>

  <!-- decision: data complete -->
  <polygon points="387,150 447,178 387,206 327,178" fill="#fdeccb" stroke="#9c6b15" stroke-width="1.2"/>
  <text x="387" y="174" font-size="8.5" text-anchor="middle" fill="#6b4a10">Data complete,</text>
  <text x="387" y="185" font-size="8.5" text-anchor="middle" fill="#6b4a10">no duplicate?</text>

  <!-- exception queue -->
  <rect x="30" y="160" width="200" height="40" rx="6" fill="#fbe2e1" stroke="#8f3a3c" stroke-width="1.2"/>
  <text x="130" y="176" font-size="9" font-weight="bold" text-anchor="middle" fill="#8f3a3c">Exception Queue</text>
  <text x="130" y="189" font-size="8" text-anchor="middle" fill="#6b2b2d">Missing / duplicate → reprocess</text>

  <!-- parallel checks box -->
  <rect x="262" y="226" width="250" height="90" rx="4" fill="none" stroke="#003426" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="387" y="240" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#003426">AUTOMATED CHECKS — RUN IN PARALLEL</text>
  <rect x="272" y="250" width="105" height="52" rx="5" fill="#fff" stroke="#003426" stroke-width="1.2"/>
  <text x="324" y="270" font-size="8" font-weight="bold" text-anchor="middle" fill="#003426">Validation &amp;</text>
  <text x="324" y="280" font-size="8" font-weight="bold" text-anchor="middle" fill="#003426">Compliance</text>
  <text x="324" y="292" font-size="7.5" text-anchor="middle" fill="#4a4a4a">CAP-05 / CAP-06</text>
  <rect x="387" y="250" width="115" height="52" rx="5" fill="#fff" stroke="#003426" stroke-width="1.2"/>
  <text x="444" y="270" font-size="8" font-weight="bold" text-anchor="middle" fill="#003426">Financial Anomaly</text>
  <text x="444" y="280" font-size="8" font-weight="bold" text-anchor="middle" fill="#003426">Assessment</text>
  <text x="444" y="292" font-size="7.5" text-anchor="middle" fill="#4a4a4a">CAP-07</text>

  <!-- decision: blocking issue -->
  <polygon points="387,336 452,366 387,396 322,366" fill="#fdeccb" stroke="#9c6b15" stroke-width="1.2"/>
  <text x="387" y="362" font-size="8.5" text-anchor="middle" fill="#6b4a10">Blocking</text>
  <text x="387" y="373" font-size="8.5" text-anchor="middle" fill="#6b4a10">issue?</text>

  <!-- Human exception review (auditor) -->
  <rect x="544" y="330" width="210" height="46" rx="6" fill="#fff" stroke="#8a5a1e" stroke-width="1.4"/>
  <text x="649" y="348" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#8a5a1e">Human Exception Review</text>
  <text x="649" y="361" font-size="8" text-anchor="middle" fill="#4a4a4a">Auditor determines outcome</text>

  <!-- Auditor decision box -->
  <rect x="544" y="404" width="210" height="56" rx="6" fill="#fff" stroke="#8a5a1e" stroke-width="1.4"/>
  <text x="649" y="420" font-size="9" font-weight="bold" text-anchor="middle" fill="#8a5a1e">Review evidence &amp; decide</text>
  <text x="649" y="433" font-size="8" text-anchor="middle" fill="#4a4a4a">Accept → continue</text>
  <text x="649" y="445" font-size="8" text-anchor="middle" fill="#4a4a4a">Reject / Clarify → Exception Queue</text>

  <!-- Route case notification -->
  <rect x="272" y="404" width="230" height="52" rx="6" fill="#fff" stroke="#003426" stroke-width="1.4"/>
  <text x="387" y="420" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#003426">Route case notification</text>
  <text x="387" y="433" font-size="8" text-anchor="middle" fill="#4a4a4a">CAP-08 · no approval action</text>
  <text x="387" y="445" font-size="8" text-anchor="middle" fill="#4a4a4a">performed by the platform</text>

  <!-- Revenue officer review -->
  <rect x="796" y="404" width="214" height="56" rx="6" fill="#fff" stroke="#1f4e8c" stroke-width="1.4"/>
  <text x="903" y="420" font-size="9" font-weight="bold" text-anchor="middle" fill="#1f4e8c">Review notification for</text>
  <text x="903" y="432" font-size="9" font-weight="bold" text-anchor="middle" fill="#1f4e8c">awareness</text>
  <text x="903" y="445" font-size="8" text-anchor="middle" fill="#4a4a4a">Tracked under WF-02 monitoring</text>

  <!-- record status -->
  <rect x="272" y="486" width="230" height="52" rx="6" fill="#fff" stroke="#003426" stroke-width="1.4"/>
  <text x="387" y="502" font-size="9" font-weight="bold" text-anchor="middle" fill="#003426">Record status &amp; audit event</text>
  <text x="387" y="516" font-size="8" text-anchor="middle" fill="#4a4a4a">Handoff to System of Record</text>
  <text x="387" y="528" font-size="8" text-anchor="middle" fill="#4a4a4a">(no payment action performed)</text>

  <!-- complete -->
  <ellipse cx="387" cy="562" rx="80" ry="16" fill="#0B4A45"/>
  <text x="387" y="567" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#fff">Workflow complete</text>

  <!-- Arrows -->
  <line x1="230" y1="114" x2="270" y2="114" stroke="#4a4a4a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="387" y1="136" x2="387" y2="148" stroke="#4a4a4a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="327" y1="178" x2="130" y2="178" stroke="#8f3a3c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="230" y="172" font-size="7.5" fill="#8f3a3c">missing/dup</text>
  <path d="M130,160 C130,140 250,120 330,116" stroke="#8f3a3c" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="150" y="140" font-size="7" fill="#8f3a3c">reprocess</text>
  <line x1="387" y1="206" x2="387" y2="224" stroke="#4a4a4a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="400" y="218" font-size="7.5" fill="#4a4a4a">complete</text>
  <line x1="387" y1="316" x2="387" y2="334" stroke="#4a4a4a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="452" y1="366" x2="544" y2="353" stroke="#4a4a4a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="465" y="350" font-size="7.5" fill="#4a4a4a">yes</text>
  <line x1="322" y1="366" x2="272" y2="418" stroke="#4a4a4a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="290" y="380" font-size="7.5" fill="#4a4a4a">no</text>
  <line x1="649" y1="376" x2="649" y2="402" stroke="#4a4a4a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="544" y1="426" x2="502" y2="422" stroke="#0B4A45" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="500" y="412" font-size="7.5" fill="#0B4A45">accept</text>
  <path d="M544,450 C500,470 460,180 328,172" stroke="#8f3a3c" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="470" y="300" font-size="7" fill="#8f3a3c">reject/clarify → Exception Queue</text>
  <line x1="502" y1="430" x2="794" y2="428" stroke="#1f4e8c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="600" y="420" font-size="7.5" fill="#1f4e8c">notify</text>
  <line x1="387" y1="456" x2="387" y2="484" stroke="#4a4a4a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="387" y1="538" x2="387" y2="546" stroke="#4a4a4a" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text x="12" y="592" font-size="8" fill="#64748b">Prototype boundaries: source-system calls, notifications, and authoritative status/payment updates are simulated. Final business authority remains human.</text>
</svg>
</div>
</body></html>
